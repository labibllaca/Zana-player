name: Android CI/CD Build Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Didea.headless=true"
      GRADLE_OPTS: "-Djava.awt.headless=true -Didea.headless=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Create Empty .env File
        run: touch .env

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Ground truth
        run: |
          git rev-parse HEAD
          git status --short
          git log --oneline -3 -- app/build.gradle.kts || true
          grep -n "namespace" app/build.gradle.kts
          if [ -f "app/src/main/java/com/labix/navirom/player/NaviromPlaybackService.kt" ]; then
            sed -n '1,30p' app/src/main/java/com/labix/navirom/player/NaviromPlaybackService.kt
          elif [ -f "app/src/main/java/com/example/navirom/player/NaviromPlaybackService.kt" ]; then
            sed -n '1,30p' app/src/main/java/com/example/navirom/player/NaviromPlaybackService.kt
          fi
          git grep -n "com.example.navirom" -- '*.kt' '*.kts' '*.xml' 2>/dev/null | head -20 || true

      - name: R quick autopsy
        run: |
          gradle :app:generateDebugRFile --no-daemon || true
          echo "=== JAR-Inhalt ==="
          for j in $(find app/build -name "R.jar" 2>/dev/null); do echo "== $j"; unzip -l "$j" | head -20; done
          echo "=== Ressourcen im Repo ==="
          find app/src/main/res -type f | head -30
          echo "=== Geisterbaum komplett ==="
          git grep -l "com.example.navirom" || true
          echo "=== Alle Package-Deklarationen ==="
          git grep -h "^package " -- "*.kt" 2>/dev/null | sort | uniq -c | sort -rn || true

      - name: Build Debug APK
        run: gradle clean assembleDebug --no-daemon

      - name: Inspect generated R
        if: failure()
        run: |
          find app/build \( -name "R.java" -o -name "R.jar" -o -iname "*r_class*" \) 2>/dev/null | head -20 || true
          for f in $(find app/build -name "R.java" 2>/dev/null | head -3); do echo "== $f"; head -5 "$f"; done

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            app/build/generated/
          if-no-files-found: ignore

      - name: Get Current Date
        id: date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Package and Rename APK with Date
        run: |
          mkdir -p build-outputs
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          cp "$APK_PATH" "build-outputs/navirom-${{ env.CURRENT_DATE }}.apk"
          echo "Created APK: build-outputs/navirom-${{ env.CURRENT_DATE }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navirom-apk-${{ env.CURRENT_DATE }}
          path: build-outputs/navirom-${{ env.CURRENT_DATE }}.apk
          if-no-files-found: error
