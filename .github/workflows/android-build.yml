name: Android CI/CD Build Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Didea.headless=true"
      GRADLE_OPTS: "-Djava.awt.headless=true -Didea.headless=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Create Empty .env File
        run: touch .env

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Ground truth
        run: |
          git rev-parse HEAD
          git status --short
          grep -n "namespace" app/build.gradle.kts
          if [ -f "app/src/main/java/com/labix/navirom/player/NaviromPlaybackService.kt" ]; then
            sed -n '1,30p' app/src/main/java/com/labix/navirom/player/NaviromPlaybackService.kt
          elif [ -f "app/src/main/java/com/example/navirom/player/NaviromPlaybackService.kt" ]; then
            sed -n '1,30p' app/src/main/java/com/example/navirom/player/NaviromPlaybackService.kt
          fi

      - name: Build Debug APK
        run: gradle clean assembleDebug --no-daemon

      - name: Get Current Date
        id: date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Package and Rename APK with Date
        run: |
          mkdir -p build-outputs
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          cp "$APK_PATH" "build-outputs/navirom-${{ env.CURRENT_DATE }}.apk"
          echo "Created APK: build-outputs/navirom-${{ env.CURRENT_DATE }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navirom-apk-${{ env.CURRENT_DATE }}
          path: build-outputs/navirom-${{ env.CURRENT_DATE }}.apk
          if-no-files-found: error
